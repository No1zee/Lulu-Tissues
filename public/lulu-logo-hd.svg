<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Great+Vibes&amp;family=Montserrat:wght@700&amp;display=swap');
      
      .lulu-text {
        font-family: 'Great Vibes', cursive;
        font-size: 340px;
        fill: #F2DA24; /* Original vibrant yellow */
      }
      
      .tissue-text {
        font-family: 'Montserrat', sans-serif;
        font-weight: 700;
        font-size: 72px;
        fill: #FFFFFF;
        letter-spacing: 0.12em;
      }
    </style>
  </defs>
  
  <!-- Original vibrant green background (can be removed or set to opacity="0" for transparent overlay) -->
  <rect width="100%" height="100%" fill="#1a8c42" />
  
  <!-- The main sweeping script text -->
  <text x="50%" y="55%" text-anchor="middle" class="lulu-text">Lulu</text>
  
  <!-- The bold geometric subtext -->
  <text x="50%" y="78%" text-anchor="middle" class="tissue-text">Tissue Products</text>
</svg>
